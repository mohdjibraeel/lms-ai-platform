services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_pass
      POSTGRES_DB: lms_ai_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: lms_minio_admin
      MINIO_ROOT_PASSWORD: lms_minio_pass
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  miniodata:
